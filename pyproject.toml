[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-finder"
version = "0.1.0"
description = "Music finder based on Bandsintown"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.14.0",
    "jinja2>=3.1.0",
    "markdown>=3.7.0",
    "bleach>=6.2.0",
    "pydantic>=2.13.0",
    "python-dotenv>=1.2.0",
    "openai>=2.30.0",
    "tqdm>=4.67.0",
]

[project.scripts]
music-finder = "app.cli:main"

[tool.setuptools.packages.find] 
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "templates/*.css", "templates/*.js"]
