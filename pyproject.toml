[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-finder"
version = "0.1.0"
description = "Music finder based on Bandsintown"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.14.0",
    "pydantic>=2.13.0",
    "python-dotenv>=1.2.0",
    "openai>=2.30.0",
]

[project.scripts]
music-finder = "app.cli:main"

[tool.setuptools.packages.find] 
where = ["."]
include = ["app*"]
